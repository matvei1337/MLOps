name: ci
on:
  push: {branches: [main, master]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWARD: test, POSTGRES_DB: churn}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d churn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/churn
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with: {enable-cache: true}
    - run: uv sync --frozen
    - run: uv run ruff check .
    - run: uv run pytest