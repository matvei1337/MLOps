name: ci
on:
  push: {branches: [main, master]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actiaons/checkout@v7
    - uses: astral-sh/setup-uv@7
      with: {enable-cache: true}
    - run: uv sync --frozen
    - run: uv run ruff check .
    - run: uv run pytest